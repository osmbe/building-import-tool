services:
  # PostgreSQL with PostGIS
  postgres:
    image: postgis/postgis:18-3.6
    platform: linux/amd64
    container_name: be2osm-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-be2osm}
    volumes:
      - postgres-data:/var/lib/postgresql
      # The following scripts will be executed in alphabetical order during the first initialization of the database
      - ./postgres/01-init-db.sql:/docker-entrypoint-initdb.d/01-init-db.sql:ro,z
      - ./postgres/02-setup-be2osm.sql:/docker-entrypoint-initdb.d/02-setup-be2osm.sql:ro,z
      - ./postgres/03-setup-osmbe.sql:/docker-entrypoint-initdb.d/03-setup-osmbe.sql:ro,z
      - ./postgres/04-setup-grb.sql:/docker-entrypoint-initdb.d/04-setup-grb.sql:ro,z
      - ./postgres/05-setup-picc.sql:/docker-entrypoint-initdb.d/05-setup-picc.sql:ro,z
      - ./postgres/06-setup-urbis.sql:/docker-entrypoint-initdb.d/06-setup-urbis.sql:ro,z
    # ports:
    #   - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-be2osm}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - be2osm

  # Nuxt 3 Application
  # Images: deploys (webhook/deploy.sh) pull the sha-<commit> images built by CI and tag them :deployed, so
  # the running release is pinned. Locally, `docker compose build` builds them instead.
  nuxt-app:
    platform: linux/amd64
    build:
      context: ./app
      args:
        OSM_CLIENT_ID: ${OSM_CLIENT_ID}
        OSM_REDIRECT_URI: ${OSM_REDIRECT_URI}
    container_name: be2osm-nuxt
    environment:
      NODE_ENV: production
      # Nuxt runtimeConfig overrides (NUXT_PUBLIC_* for public, NUXT_* for private)
      NUXT_PUBLIC_OSM_CLIENT_ID: ${OSM_CLIENT_ID}
      NUXT_PUBLIC_OSM_REDIRECT_URI: ${OSM_REDIRECT_URI}
      NUXT_OSM_CLIENT_SECRET: ${OSM_CLIENT_SECRET}
      NUXT_JWT_SECRET: ${JWT_SECRET}
      NUXT_DB_HOST: ${POSTGRES_HOST:-postgres}
      NUXT_DB_PORT: ${POSTGRES_PORT:-5432}
      NUXT_DB_USER: ${POSTGRES_USER}
      NUXT_DB_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - be2osm

  # Martin Tile Server - GRB Data
  grb-tiles:
    image: ghcr.io/maplibre/martin:1.16.1
    container_name: be2osm-grb-tiles
    command: ["--config", "/config.yaml"]
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./config/martin/grb-config.yaml:/config.yaml:ro,Z
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - be2osm

  # Martin Tile Server - OSM Data
  osm-tiles:
    image: ghcr.io/maplibre/martin:1.16.1
    container_name: be2osm-osm-tiles
    command: ["--config", "/config.yaml"]
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./config/martin/osm-config.yaml:/config.yaml:ro,Z
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - be2osm

  # Martin Tile Server - PICC Data (Wallonia)
  picc-tiles:
    image: ghcr.io/maplibre/martin:1.16.1
    container_name: be2osm-picc-tiles
    command: ["--config", "/config.yaml"]
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./config/martin/picc-config.yaml:/config.yaml:ro,Z
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - be2osm

  # Martin Tile Server - UrbIS Data (Brussels)
  urbis-tiles:
    image: ghcr.io/maplibre/martin:1.16.1
    container_name: be2osm-urbis-tiles
    command: ["--config", "/config.yaml"]
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./config/martin/urbis-config.yaml:/config.yaml:ro,Z
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - be2osm

  # Data Processing Tools (ogr2ogr, imposm3, Just)
  # Usage:
  #   docker compose run --rm processing just <command>
  processing:
    # Note: No platform specified - builds natively for host architecture
    # imposm3 is built from source on arm64
    build:
      context: ./processing
      dockerfile: Dockerfile
    container_name: be2osm-processing
    profiles:
      - processing
    env_file:
      - .env
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
    volumes:
      - ./processing:/work:z
      - ./processing/data:/work/data:z
      - ./processing/logs:/work/logs:z
      # Mount gh CLI config for remote import authentication
      # Note: Update this path to match your system's gh config location
      # Linux: /home/username/.config/gh
      # macOS: /Users/username/.config/gh
      - ${HOME}/.config/gh:/root/.config/gh:ro
    depends_on:
      postgres:
        condition: service_healthy
    stdin_open: true
    tty: true
    networks:
      - be2osm

  # Webhook service: runs deploys, restores of CI artifacts, imports and updates as jobs (webhook/server.py).
  # Its scripts are read from the checkout; deploy.sh updates the checkout, so it is mounted read-write.
  webhook:
    build:
      context: ./webhook
    container_name: be2osm-webhook
    environment:
      WEBHOOK_SECRET: ${WEBHOOK_SECRET}
      WEBHOOK_PORT: 9000
      GH_TOKEN: ${GH_TOKEN:-}
      GH_REPO: ${GH_REPO:-osmbe/building-import-tool}
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-building-import-tool-local}
      # Project dir inside container mirrors the host path so docker compose
      # volume paths resolve identically for both the CLI and the Docker daemon
      COMPOSE_PROJECT_DIR: ${COMPOSE_PROJECT_DIR:-${PWD}}
    volumes:
      # gh CLI config for artifact download authentication
      # Linux: /home/username/.config/gh  |  macOS: /Users/username/.config/gh
      - ${HOME}/.config/gh:/root/.config/gh:ro
      # Docker socket + project dir (mounted at same host path for volume resolution)
      - /var/run/docker.sock:/var/run/docker.sock
      - ${COMPOSE_PROJECT_DIR:-${PWD}}:${COMPOSE_PROJECT_DIR:-${PWD}}
      # Job records, logs and the global job lock
      - webhook-state:/state
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - be2osm

  caddy:
    image: caddy:2-alpine
    container_name: be2osm-caddy
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro,z
      - caddy_data:/data
    depends_on:
      nuxt-app:
        condition: service_healthy
      grb-tiles:
        condition: service_healthy
      osm-tiles:
        condition: service_healthy
      picc-tiles:
        condition: service_healthy
      urbis-tiles:
        condition: service_healthy
      webhook:
        condition: service_started
    restart: unless-stopped
    networks:
      - be2osm

networks:
  be2osm:
    driver: bridge
volumes:
  postgres-data:
  caddy_data:
  webhook-state:

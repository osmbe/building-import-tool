# Development overrides for docker-compose.yml
# This file is automatically loaded by docker compose in development
# For production, use: docker compose -f docker-compose.yml up

services:
  # Nuxt application - development mode with hot reload
  nuxt-app:
    user: root
    command: sh -c "npm install && npm run dev"
    volumes:
      # Mount source code for hot reload
      - ./app:/app
      # Use named volume for node_modules to get correct Linux binaries
      - nuxt-node-modules:/app/node_modules
    environment:
      NODE_ENV: development
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # GRB tile server - no direct port exposure, accessed via Caddy
  grb-tiles:
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # OSM tile server - no direct port exposure, accessed via Caddy
  osm-tiles:
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  # Named volume for Nuxt node_modules with Linux binaries
  nuxt-node-modules:

name: GRB Import

on:
  workflow_dispatch:

env:
  POSTGRES_USER: be2osm
  POSTGRES_PASSWORD: be2osm
  POSTGRES_DB: be2osm

jobs:
  import:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:18-3.6
        env:
          POSTGRES_USER: be2osm
          POSTGRES_PASSWORD: be2osm
          POSTGRES_DB: be2osm
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Free up disk space
        run: |
          echo "Before cleanup:"
          df -h /
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af
          echo "After cleanup:"
          df -h /

      - uses: actions/checkout@v6

      - name: Install PostgreSQL 18 client
        run: |
          sudo apt-get install -y curl ca-certificates
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc --fail https://www.postgresql.org/media/keys/ACCC4CF8.asc
          sudo sh -c 'echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          sudo apt-get update
          sudo apt-get install -y postgresql-client-18

      - name: Initialize be2osm database
        run: |
          # Only run scripts needed for GRB import.
          # 02: sets up grb schema in be2osm database
          # Skipping 01 (creates osmbe, not needed), 03/04/05: OSM/FDW/PICC not needed here
          PGPASSWORD=be2osm psql -h localhost -U be2osm -d be2osm -f postgres/02-setup-be2osm.sql

      - name: Build processing image
        run: docker build -t processing ./processing

      - name: Import GRB data
        run: |
          docker run --network host \
            -v ${{ github.workspace }}/processing:/work \
            -e POSTGRES_HOST=localhost \
            -e POSTGRES_PORT=5432 \
            -e POSTGRES_USER=be2osm \
            -e POSTGRES_PASSWORD=be2osm \
            -e DIGITAL_VLAANDEREN_API_KEY=${{ secrets.DIGITAL_VLAANDEREN_API_KEY }} \
            -e DIGITAL_VLAANDEREN_API_BASE_URL=${{ vars.DIGITAL_VLAANDEREN_API_BASE_URL }} \
            processing just grb-full

      - name: Create GRB dump
        run: |
          PGPASSWORD=be2osm pg_dump -h localhost -U be2osm \
            --data-only --disable-triggers \
            --no-owner --no-acl \
            -n grb \
            be2osm | gzip > be2osm.sql.gz
          ls -lh be2osm.sql.gz

      - name: Upload GRB dump
        uses: actions/upload-artifact@v4
        with:
          name: be2osm-dump
          path: be2osm.sql.gz
          retention-days: 7

      - name: Notify server to restore dump
        if: ${{ vars.WEBHOOK_URL != '' }}
        run: |
          curl -fsSL -X POST "${{ vars.WEBHOOK_URL }}/grb-restore" \
            -H "Content-Type: application/json" \
            -H "X-Webhook-Secret: ${{ secrets.WEBHOOK_SECRET }}" \
            -d "{\"run_id\": \"${{ github.run_id }}\"}"

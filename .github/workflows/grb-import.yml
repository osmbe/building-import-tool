name: GRB Import

on:
  workflow_dispatch:
    inputs:
      products:
        description: "Products to download/import (comma-separated: gbg,gba,knw,addresses or all)"
        required: false
        default: "all"
      download_only:
        description: "Only validate download step (skip DB import/dump/upload)"
        required: false
        type: boolean
        default: false

env:
  POSTGRES_USER: be2osm
  POSTGRES_PASSWORD: be2osm
  POSTGRES_DB: be2osm

jobs:
  import:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:18-3.6
        env:
          POSTGRES_USER: be2osm
          POSTGRES_PASSWORD: be2osm
          POSTGRES_DB: be2osm
        options: >-
          --health-cmd "pg_isready -U be2osm -d be2osm"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Free up disk space
        run: |
          echo "Before cleanup:"
          df -h /
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af
          echo "After cleanup:"
          df -h /

      - uses: actions/checkout@v7

      - name: Install PostgreSQL 18 client
        run: |
          sudo apt-get install -y curl ca-certificates
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc --fail https://www.postgresql.org/media/keys/ACCC4CF8.asc
          sudo sh -c 'echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          sudo apt-get update
          sudo apt-get install -y postgresql-client-18

      - name: Initialize be2osm database
        run: |
          # Only run scripts needed for GRB import.
          # 02: sets up grb schema in be2osm database
          # Skipping 01 (creates osmbe, not needed), 03/04/05: OSM/FDW/PICC not needed here
          PGPASSWORD=be2osm psql -h localhost -U be2osm -d be2osm -f postgres/02-setup-be2osm.sql

      - name: Build processing image
        run: docker build -t processing ./processing

      - name: Import GRB data
        run: |
          PRODUCTS="${{ github.event.inputs.products || 'all' }}"
          DOWNLOAD_ONLY="${{ github.event.inputs.download_only || 'false' }}"
          if [ "$PRODUCTS" = "all" ] || [ -z "$PRODUCTS" ]; then
            if [ "$DOWNLOAD_ONLY" = "true" ]; then
              JUST_COMMAND="just grb-order-all && just _grb-wait-for-orders && just grb-download-all"
            else
              JUST_COMMAND="just grb-full"
            fi
          else
            # Reuse/create orders only for selected products to avoid full reruns
            # Example: products=knw or products=gbg,knw
            if [ "$DOWNLOAD_ONLY" = "true" ]; then
              JUST_COMMAND="just grb-download-selected \"$PRODUCTS\""
            else
              JUST_COMMAND="just grb-download-selected \"$PRODUCTS\" && just grb-import"
            fi
          fi

          docker run --network host \
            -v ${{ github.workspace }}/processing:/work \
            -e POSTGRES_HOST=localhost \
            -e POSTGRES_PORT=5432 \
            -e POSTGRES_USER=be2osm \
            -e POSTGRES_PASSWORD=be2osm \
            -e DIGITAL_VLAANDEREN_API_KEY=${{ secrets.DIGITAL_VLAANDEREN_API_KEY }} \
            -e DIGITAL_VLAANDEREN_API_BASE_URL=${{ vars.DIGITAL_VLAANDEREN_API_BASE_URL }} \
            -e GRB_DOWNLOAD_PARALLEL=0 \
            -e GRB_DOWNLOAD_MAX_TIME_SEC=7200 \
            -e GRB_DOWNLOAD_MAX_ATTEMPTS=20 \
            -e GRB_DOWNLOAD_RETRY_SLEEP_SEC=90 \
            processing bash -lc "$JUST_COMMAND"

      - name: Create GRB dump
        if: ${{ github.event.inputs.download_only != 'true' }}
        run: |
          PGPASSWORD=be2osm pg_dump -h localhost -U be2osm \
            --data-only --disable-triggers \
            --no-owner --no-acl \
            -n grb --exclude-table-data=grb.schema_migrations \
            be2osm | gzip > be2osm.sql.gz
          ls -lh be2osm.sql.gz

      - name: Upload GRB dump
        if: ${{ github.event.inputs.download_only != 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: be2osm-dump
          path: be2osm.sql.gz
          retention-days: 7

      - name: Restore the dump on the server (waits for the job)
        if: ${{ github.event.inputs.download_only != 'true' && vars.WEBHOOK_URL != '' }}
        timeout-minutes: 300
        env:
          WEBHOOK_URL: ${{ vars.WEBHOOK_URL }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
        run: |
          .github/scripts/webhook-job.sh grb-restore '{"run_id": "${{ github.run_id }}"}'

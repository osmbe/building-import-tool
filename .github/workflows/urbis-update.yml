name: Urbis Update

on:
  workflow_dispatch:
  # Monthly schedule ('0 5 1 * *') paused: the update drops every Urbis table before downloading the new data.
  # Re-enabled once it builds next to the live data and swaps.

jobs:
  trigger-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Trigger Urbis update on server
        if: ${{ vars.WEBHOOK_URL != '' }}
        timeout-minutes: 300
        env:
          WEBHOOK_URL: ${{ vars.WEBHOOK_URL }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
        run: .github/scripts/webhook-job.sh update-urbis

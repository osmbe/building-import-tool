name: Urbis Update

on:
  workflow_dispatch:
  # Monthly schedule ('0 5 1 * *') paused: the update drops every Urbis table before downloading the new data.
  # Re-enabled once it builds next to the live data and swaps.

jobs:
  trigger-update:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Urbis update on server
        if: ${{ vars.WEBHOOK_URL != '' }}
        run: |
          curl -fsSL -X POST "${{ vars.WEBHOOK_URL }}/update-urbis" \
            -H "X-Webhook-Secret: ${{ secrets.WEBHOOK_SECRET }}"
          echo "Urbis update triggered on server"

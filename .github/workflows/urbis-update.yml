name: UrbIS Update

on:
  workflow_dispatch:
  # Monthly: a full re-download, loaded and swapped in one transaction (the map keeps the previous data meanwhile)
  schedule:
    - cron: '0 5 1 * *'

jobs:
  trigger-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Trigger UrbIS update on server
        if: ${{ vars.WEBHOOK_URL != '' }}
        timeout-minutes: 300
        env:
          WEBHOOK_URL: ${{ vars.WEBHOOK_URL }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
        run: .github/scripts/webhook-job.sh update-urbis

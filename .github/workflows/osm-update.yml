name: OSM Update

on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * *'  # Daily at 4am UTC

jobs:
  trigger-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Trigger OSM update on server
        if: ${{ vars.WEBHOOK_URL != '' }}
        timeout-minutes: 300
        env:
          WEBHOOK_URL: ${{ vars.WEBHOOK_URL }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
        run: .github/scripts/webhook-job.sh update-osm

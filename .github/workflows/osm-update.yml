# This currently doesn't work because Imposm state is not stored on the server.
# Only the database dump is restored by `osm-import.yml` without any reference of Imposm state/cache/...

name: OSM Update

on:
  workflow_dispatch:
  # schedule:
  #   - cron: '0 4 * * *'  # Daily at 4am UTC

jobs:
  trigger-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Trigger OSM update on server
        if: ${{ vars.WEBHOOK_URL != '' }}
        timeout-minutes: 300
        env:
          WEBHOOK_URL: ${{ vars.WEBHOOK_URL }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
        run: .github/scripts/webhook-job.sh update-osm

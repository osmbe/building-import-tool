name: CI

# Every push and pull request runs the app checks and the database suite (tests/db/run.sh: migrations, imports
# on fixtures, the four Martin servers with the production configs, API integration tests, webhook and deploy
# scripts, and the previous release on the new schema).
# On main, images are only built and deployed once both pass.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  REGISTRY: ghcr.io

jobs:
  app:
    name: App (fmt, lint, typecheck, unit tests + coverage, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npx vp fmt --check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build

  infra:
    name: Infra (workflows, shell scripts, justfile, compose files)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -no-color
      - name: shellcheck
        run: |
          docker run --rm -v "$PWD:/mnt" -w /mnt koalaman/shellcheck:v0.10.0 -S warning -s bash \
            webhook/*.sh tests/db/*.sh tests/db/cases/*.sh tests/db/bin/gh tests/db/bin/deploy/* \
            tests/fixtures/build.sh processing/sql/migrate.sh processing/scripts/*.sh .github/scripts/*.sh scripts/*.sh
      - name: justfile parses
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq just
          just --justfile processing/justfile --summary >/dev/null
      - name: compose files are valid
        run: |
          docker compose -f docker-compose.yml config -q
          docker compose -f docker-compose.test.yml config -q

  db:
    name: Database, imports, Martin and API integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install app dependencies (API integration tests)
        working-directory: app
        run: npm ci
      # The previous release (parent commit on main, base of a pull request) must keep working on the schema
      # this commit migrates to: tests/db/cases/90-previous-release.sh runs its Martin configs and API tests.
      - name: Check out the previous release
        env:
          PREVIOUS_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$PREVIOUS_SHA" ] || [ "$PREVIOUS_SHA" = "0000000000000000000000000000000000000000" ]; then
            PREVIOUS_SHA=$(git rev-parse HEAD)
          fi
          git fetch --quiet --depth=1 origin "$PREVIOUS_SHA"
          git worktree add --detach "$RUNNER_TEMP/previous" "$PREVIOUS_SHA"
          (cd "$RUNNER_TEMP/previous/app" && npm ci --silent)
          echo "PREVIOUS_DIR=$RUNNER_TEMP/previous" >> "$GITHUB_ENV"
      - run: tests/db/run.sh

  images:
    name: Build and push ${{ matrix.image }}
    needs: [app, infra, db]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: nuxt-app
            context: ./app
          - image: processing
            context: ./processing
          - image: webhook
            context: ./webhook
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.image }}
          tags: |
            type=sha,prefix={{branch}}-
            type=sha,format=long,prefix=sha-
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            OSM_CLIENT_ID=${{ secrets.OSM_CLIENT_ID }}
            OSM_CLIENT_SECRET=${{ secrets.OSM_CLIENT_SECRET }}
            OSM_REDIRECT_URI=${{ secrets.OSM_REDIRECT_URI }}
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

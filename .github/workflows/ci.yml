name: CI

# Every push and pull request runs the app checks and the database suite (tests/db/run.sh: migrations, imports
# on fixtures, the four Martin servers with the production configs, API integration tests, webhook and deploy
# scripts, and the previous release on the new schema).
# On main, images are only built and deployed once both pass.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  REGISTRY: ghcr.io

jobs:
  app-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run build

  app-vp-fmt:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run fmt

  app-vp-lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run lint -- --format=github

  app-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run test:coverage

  app-typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run typecheck

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Download actionlint
        id: get_actionlint
        run: bash <(curl https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
        shell: bash
      - name: Check workflow files
        run: ${{ steps.get_actionlint.outputs.executable }} -color
        shell: bash

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: |
          shellcheck .github/scripts/*.sh \
            processing/scripts/*.sh processing/sql/*.sh \
            scripts/*.sh scripts/import/*.sh \
            tests/db/*.sh tests/db/cases/*.sh \
            webhook/*.sh

  justfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v4
      - run: just --justfile processing/justfile --summary >/dev/null

  docker-compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: |
          docker compose -f docker-compose.yml config -q
          docker compose -f docker-compose.local.yml config -q
          docker compose -f docker-compose.test.yml config -q

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install app dependencies (API integration tests)
        working-directory: app
        run: npm ci
      # The previous release (parent commit on main, base of a pull request) must keep working on the schema
      # this commit migrates to: tests/db/cases/90-previous-release.sh runs its Martin configs and API tests.
      - name: Check out the previous release
        env:
          PREVIOUS_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$PREVIOUS_SHA" ] || [ "$PREVIOUS_SHA" = "0000000000000000000000000000000000000000" ]; then
            PREVIOUS_SHA=$(git rev-parse HEAD)
          fi
          git fetch --quiet --depth=1 origin "$PREVIOUS_SHA"
          git worktree add --detach "$RUNNER_TEMP/previous" "$PREVIOUS_SHA"
          (cd "$RUNNER_TEMP/previous/app" && npm ci --silent)
          echo "PREVIOUS_DIR=$RUNNER_TEMP/previous" >> "$GITHUB_ENV"
      - run: tests/db/run.sh

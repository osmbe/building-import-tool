name: GRB Update

on:
  workflow_dispatch:
  # Weekly schedule ('0 5 * * 1') paused: the diff import appends raw shapefile rows into grb.building_polygons
  # and the plain REFRESH blocks GRB tiles. Re-enabled once the update path is fixed and tested.

jobs:
  trigger-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Trigger GRB update on server
        if: ${{ vars.WEBHOOK_URL != '' }}
        timeout-minutes: 300
        env:
          WEBHOOK_URL: ${{ vars.WEBHOOK_URL }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
        run: .github/scripts/webhook-job.sh update-grb

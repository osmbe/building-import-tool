name: GRB Update

on:
  workflow_dispatch:
  # Weekly schedule ('0 5 * * 1') paused until a manual run on the server has confirmed the file names of the
  # real difference download (the diff import is now transactional and tested on fixtures).

jobs:
  trigger-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Trigger GRB update on server
        if: ${{ vars.WEBHOOK_URL != '' }}
        timeout-minutes: 300
        env:
          WEBHOOK_URL: ${{ vars.WEBHOOK_URL }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
        run: .github/scripts/webhook-job.sh update-grb

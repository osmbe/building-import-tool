name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

env:
  REGISTRY: ghcr.io

jobs:
  build-nuxt:
    name: Build Nuxt App
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/nuxt-app
          tags: |
            type=sha,prefix={{branch}}-
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./app
          file: ./app/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            OSM_CLIENT_ID=${{ secrets.OSM_CLIENT_ID }}
            OSM_CLIENT_SECRET=${{ secrets.OSM_CLIENT_SECRET }}
            OSM_REDIRECT_URI=${{ secrets.OSM_REDIRECT_URI }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-processing:
    name: Build Processing Tools
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/processing
          tags: |
            type=sha,prefix={{branch}}-
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./processing
          file: ./processing/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: [build-nuxt, build-processing]
    environment:
      name: ${{ inputs.environment || 'production' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Copy deployment script to VPS
        run: |
          scp -i ~/.ssh/id_rsa scripts/deploy-vps.sh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/tmp/deploy-vps.sh

      - name: Create .env file on VPS
        run: |
          ssh -i ~/.ssh/id_rsa ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "cat > /opt/docker/buildings/.env" << EOF
          # Database Configuration
          POSTGRES_USER=be2osm
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB=be2osm
          POSTGRES_HOST=postgres
          POSTGRES_PORT=5432

          # Domain Configuration
          DOMAIN=${{ secrets.DOMAIN }}

          # OSM OAuth 2.0
          OSM_CLIENT_ID=${{ secrets.OSM_CLIENT_ID }}
          OSM_CLIENT_SECRET=${{ secrets.OSM_CLIENT_SECRET }}
          OSM_REDIRECT_URI=${{ secrets.OSM_REDIRECT_URI }}

          # OSM Data
          OSM_REGION=europe/belgium

          # Application
          NODE_ENV=production
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          TZ=Europe/Brussels

          # Docker Images
          NUXT_IMAGE=${{ env.REGISTRY }}/${{ github.repository }}/nuxt-app:latest
          PROCESSING_IMAGE=${{ env.REGISTRY }}/${{ github.repository }}/processing:latest
          EOF

      - name: Deploy application
        run: |
          ssh -i ~/.ssh/id_rsa ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << EOF
          set -e

          # Change to application directory
          cd /opt/docker/buildings

          # Login to GHCR to pull private images
          # Uses PAT with read:packages scope stored in GHCR_PAT secret
          echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.repository_owner }} --password-stdin

          # Make deployment script executable and run it
          chmod +x /tmp/deploy-vps.sh
          APP_DIR=/opt/docker/buildings /tmp/deploy-vps.sh

          # Cleanup
          rm /tmp/deploy-vps.sh
          EOF

      - name: Verify deployment
        run: |
          ssh -i ~/.ssh/id_rsa ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
          cd /opt/docker/buildings

          echo "Checking service health..."

          # Wait for services to be healthy
          MAX_ATTEMPTS=30
          ATTEMPT=0

          while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
            if docker compose ps | grep -q "Up"; then
              echo "Services are running"
              docker compose ps
              exit 0
            fi

            ATTEMPT=$((ATTEMPT + 1))
            echo "Waiting for services... ($ATTEMPT/$MAX_ATTEMPTS)"
            sleep 2
          done

          echo "ERROR: Services failed to start"
          docker compose logs --tail=50
          exit 1
          EOF

      - name: Cleanup old images on VPS
        if: success()
        run: |
          ssh -i ~/.ssh/id_rsa ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
          echo "Cleaning up old Docker images..."
          docker image prune -af --filter "until=72h"
          EOF

      - name: Generate deployment summary
        if: always()
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** ${{ inputs.environment || 'production' }}" >> $GITHUB_STEP_SUMMARY
          echo "**Domain:** https://${{ secrets.DOMAIN }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Deployment failed. Check logs for details."

name: docker

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      attestations: write
      artifact-metadata: write
      id-token: write

    strategy:
      matrix:
        include:
          - image: nuxt-app
            context: ./app
          - image: processing
            context: ./processing
          - image: webhook
            context: ./webhook

    steps:
      - uses: actions/checkout@v7

      - name: Extract metadata (tags, labels) for Docker Image
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha
            type=sha,format=long

      - name: Login to registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build & Push Docker Image
        uses: docker/build-push-action@v7
        id: push
        with:
          build-args: |
            OSM_CLIENT_ID=${{ secrets.OSM_CLIENT_ID }}
            OSM_CLIENT_SECRET=${{ secrets.OSM_CLIENT_SECRET }}
            OSM_REDIRECT_URI=${{ secrets.OSM_REDIRECT_URI }}
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/Dockerfile
          labels: ${{ steps.meta.outputs.labels }}
          push: ${{ github.event_name != 'pull_request' && matrix.image != 'nuxt-app' }}
          tags: ${{ steps.meta.outputs.tags }}

      - name: Generate artifact attestation
        uses: actions/attest@v4
        if: ${{ github.event_name != 'pull_request' && matrix.image != 'nuxt-app' }}
        with:
          subject-name: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
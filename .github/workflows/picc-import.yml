name: PICC Import

on:
  workflow_dispatch:

env:
  POSTGRES_USER: be2osm
  POSTGRES_PASSWORD: be2osm
  POSTGRES_DB: be2osm

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # Phase 1: Import each province in parallel
  # ──────────────────────────────────────────────────────────────────────────
  import-province:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        province: [BRABANT_WALLON, HAINAUT, LIEGE, LUXEMBOURG, NAMUR]
    name: Import ${{ matrix.province }}

    services:
      postgres:
        image: postgis/postgis:18-3.6
        env:
          POSTGRES_USER: be2osm
          POSTGRES_PASSWORD: be2osm
          POSTGRES_DB: be2osm
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af
          df -h /

      - uses: actions/checkout@v7

      - name: Install PostgreSQL 18 client
        run: |
          sudo apt-get install -y curl ca-certificates
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc --fail https://www.postgresql.org/media/keys/ACCC4CF8.asc
          sudo sh -c 'echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          sudo apt-get update
          sudo apt-get install -y postgresql-client-18

      - name: Initialize database
        run: PGPASSWORD=be2osm psql -h localhost -U be2osm -d be2osm -f postgres/05-setup-picc.sql

      - name: Build processing image
        run: docker build -t processing ./processing

      - name: Import province ${{ matrix.province }}
        run: |
          docker run --network host \
            -v ${{ github.workspace }}/processing:/work \
            -e POSTGRES_HOST=localhost \
            -e POSTGRES_PORT=5432 \
            -e POSTGRES_USER=be2osm \
            -e POSTGRES_PASSWORD=be2osm \
            processing just picc-province-import ${{ matrix.province }}

      - name: Upload province dump
        uses: actions/upload-artifact@v4
        with:
          name: picc-${{ matrix.province }}
          path: processing/data/picc/picc-${{ matrix.province }}.dump
          retention-days: 1

  # ──────────────────────────────────────────────────────────────────────────
  # Phase 2: Merge all provinces, create matview, produce final dump
  # ──────────────────────────────────────────────────────────────────────────
  finalize:
    runs-on: ubuntu-latest
    needs: import-province
    name: Finalize (merge + matview)

    services:
      postgres:
        image: postgis/postgis:18-3.6
        env:
          POSTGRES_USER: be2osm
          POSTGRES_PASSWORD: be2osm
          POSTGRES_DB: be2osm
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v7

      - name: Install PostgreSQL 18 client
        run: |
          sudo apt-get install -y curl ca-certificates
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc --fail https://www.postgresql.org/media/keys/ACCC4CF8.asc
          sudo sh -c 'echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          sudo apt-get update
          sudo apt-get install -y postgresql-client-18

      - name: Initialize database
        run: PGPASSWORD=be2osm psql -h localhost -U be2osm -d be2osm -f postgres/05-setup-picc.sql

      - name: Download all province dumps
        uses: actions/download-artifact@v4
        with:
          path: dumps
          pattern: picc-*
          merge-multiple: true

      - name: List province dumps
        run: ls -lh dumps/

      - name: Build processing image
        run: docker build -t processing ./processing

      - name: Restore provinces and create matview
        run: |
          docker run --network host \
            -v ${{ github.workspace }}/processing:/work \
            -v ${{ github.workspace }}/dumps:/dumps \
            -e POSTGRES_HOST=localhost \
            -e POSTGRES_PORT=5432 \
            -e POSTGRES_USER=be2osm \
            -e POSTGRES_PASSWORD=be2osm \
            processing just picc-finalize-provinces /dumps

      - name: Create final PICC dump
        run: |
          PGPASSWORD=be2osm pg_dump -h localhost -U be2osm \
            --no-owner --no-acl \
            -n picc \
            be2osm | gzip > picc.sql.gz
          ls -lh picc.sql.gz

      - name: Upload PICC dump
        uses: actions/upload-artifact@v4
        with:
          name: picc-dump
          path: picc.sql.gz
          retention-days: 7

      - name: Notify server to restore dump
        if: ${{ vars.WEBHOOK_URL != '' }}
        run: |
          curl -fsSL -X POST "${{ vars.WEBHOOK_URL }}/picc-restore" \
            -H "Content-Type: application/json" \
            -H "X-Webhook-Secret: ${{ secrets.WEBHOOK_SECRET }}" \
            -d "{\"run_id\": \"${{ github.run_id }}\"}"

name: Patch Address-Building Links

on:
  workflow_dispatch:

env:
  POSTGRES_USER: be2osm
  POSTGRES_PASSWORD: be2osm
  POSTGRES_DB: be2osm

jobs:
  patch:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:18-3.6
        env:
          POSTGRES_USER: be2osm
          POSTGRES_PASSWORD: be2osm
          POSTGRES_DB: be2osm
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Install PostgreSQL 18 client
        run: |
          sudo apt-get install -y curl ca-certificates
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc --fail https://www.postgresql.org/media/keys/ACCC4CF8.asc
          sudo sh -c 'echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          sudo apt-get update
          sudo apt-get install -y postgresql-client-18

      - name: Initialize schema and drop FK constraint
        run: |
          PGPASSWORD=be2osm psql -h localhost -U be2osm -d be2osm -f postgres/02-setup-be2osm.sql
          # Drop FK so we can import without needing addresses populated in this DB
          PGPASSWORD=be2osm psql -h localhost -U be2osm -d be2osm -c \
            "ALTER TABLE grb.address_building_links DROP CONSTRAINT IF EXISTS fk_address_building_links_adres_id;"

      - name: Build processing image
        run: docker build -t processing ./processing

      - name: Download Addresses product and import address-building links
        run: |
          docker run --network host \
            -v ${{ github.workspace }}/processing:/work \
            -e POSTGRES_HOST=localhost \
            -e POSTGRES_PORT=5432 \
            -e POSTGRES_USER=be2osm \
            -e POSTGRES_PASSWORD=be2osm \
            -e DIGITAL_VLAANDEREN_API_KEY=${{ secrets.DIGITAL_VLAANDEREN_API_KEY }} \
            -e DIGITAL_VLAANDEREN_API_BASE_URL=${{ vars.DIGITAL_VLAANDEREN_API_BASE_URL }} \
            processing just grb-patch-address-links

      - name: Verify row count
        run: |
          COUNT=$(PGPASSWORD=be2osm psql -h localhost -U be2osm -d be2osm -t -A \
            -c "SELECT COUNT(*) FROM grb.address_building_links;")
          echo "address_building_links rows: $COUNT"
          if [ "$COUNT" -eq 0 ]; then
            echo "ERROR: No rows imported into address_building_links" >&2
            exit 1
          fi

      - name: Create address-links patch dump
        run: |
          PGPASSWORD=be2osm pg_dump -h localhost -U be2osm \
            --data-only --disable-triggers \
            --no-owner --no-acl \
            -t grb.address_building_links \
            be2osm | gzip > address-links-patch.sql.gz
          ls -lh address-links-patch.sql.gz

      - name: Upload patch dump
        uses: actions/upload-artifact@v4
        with:
          name: address-links-patch
          path: address-links-patch.sql.gz
          retention-days: 7

      - name: Notify server to apply patch
        if: ${{ vars.WEBHOOK_URL != '' }}
        run: |
          curl -fsSL -X POST "${{ vars.WEBHOOK_URL }}/address-links-patch" \
            -H "Content-Type: application/json" \
            -H "X-Webhook-Secret: ${{ secrets.WEBHOOK_SECRET }}" \
            -d "{\"run_id\": \"${{ github.run_id }}\"}"

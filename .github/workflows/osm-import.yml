name: OSM Import

on:
  workflow_dispatch:

env:
  POSTGRES_USER: be2osm
  POSTGRES_PASSWORD: be2osm
  POSTGRES_DB: be2osm

jobs:
  import:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:18-3.6
        env:
          POSTGRES_USER: be2osm
          POSTGRES_PASSWORD: be2osm
          POSTGRES_DB: be2osm
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v6

      - name: Install PostgreSQL 18 client
        run: |
          sudo apt-get install -y curl ca-certificates
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc --fail https://www.postgresql.org/media/keys/ACCC4CF8.asc
          sudo sh -c 'echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          sudo apt-get update
          sudo apt-get install -y postgresql-client-18

      - name: Initialize osmbe database
        run: |
          # Only run scripts needed for OSM import.
          # 01: creates the osmbe database
          # 03: sets up the osm schema inside osmbe (uses \c osmbe internally)
          # Skipping 02/04/05: GRB, FDW, PICC are not needed here and 04 would
          # fail trying to query grb.buildings which doesn't exist in CI.
          PGPASSWORD=be2osm psql -h localhost -U be2osm -d be2osm -f postgres/01-init-db.sql
          PGPASSWORD=be2osm psql -h localhost -U be2osm -d be2osm -f postgres/03-setup-osmbe.sql

      - name: Build processing image
        run: docker build -t processing ./processing

      - name: Download and import OSM
        run: |
          docker run --network host \
            -v ${{ github.workspace }}/processing:/work \
            -e POSTGRES_HOST=localhost \
            -e POSTGRES_PORT=5432 \
            -e POSTGRES_USER=be2osm \
            -e POSTGRES_PASSWORD=be2osm \
            processing just osm-download osm-import

      - name: Create OSM dump
        run: |
          # Dump only the osm schema (not the import scratch schema).
          # --no-owner --no-acl: avoid permission issues when restoring on production.
          PGPASSWORD=be2osm pg_dump -h localhost -U be2osm \
            --data-only --disable-triggers \
            --no-owner --no-acl \
            -n osm \
            osmbe | gzip > osmbe.sql.gz
          ls -lh osmbe.sql.gz

      - name: Upload OSM dump
        uses: actions/upload-artifact@v4
        with:
          name: osmbe-dump
          path: osmbe.sql.gz
          retention-days: 7

      - name: Notify server to restore dump
        if: ${{ vars.WEBHOOK_URL != '' }}
        run: |
          curl -fsSL -X POST "${{ vars.WEBHOOK_URL }}/osm-restore" \
            -H "Content-Type: application/json" \
            -H "X-Webhook-Secret: ${{ secrets.WEBHOOK_SECRET }}" \
            -d "{\"run_id\": \"${{ github.run_id }}\"}"

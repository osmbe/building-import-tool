name: UrbIS (Brussels) Full import

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

env:
  PROCESSING_IMAGE: ghcr.io/${{ github.repository }}/processing:sha-${{ github.sha }}

jobs:
  process:
    runs-on: ubuntu-latest
    name: Process UrbIS

    services:
      postgres:
        image: postgis/postgis:18-3.6
        env:
          POSTGRES_USER: be2osm
          POSTGRES_PASSWORD: be2osm
          POSTGRES_DB: be2osm
        options: >-
          --health-cmd "pg_isready -U be2osm -d be2osm"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v7

      - name: Install PostgreSQL 18 client
        run: |
          sudo apt-get install -y curl ca-certificates
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc --fail https://www.postgresql.org/media/keys/ACCC4CF8.asc
          sudo sh -c 'echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          sudo apt-get update
          sudo apt-get install -y postgresql-client-18

      - name: Initialize be2osm database
        run: |
          PGPASSWORD=be2osm psql -h localhost -U be2osm -d be2osm -v ON_ERROR_STOP=1 -f postgres/02-setup-be2osm.sql
          PGPASSWORD=be2osm psql -h localhost -U be2osm -d be2osm -v ON_ERROR_STOP=1 -f postgres/06-setup-urbis.sql

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull processing image
        run: docker pull "$PROCESSING_IMAGE"

      - name: Import UrbIS data
        run: |
          docker run --network host \
            -v ${{ github.workspace }}/processing:/work \
            -e POSTGRES_HOST=localhost \
            -e POSTGRES_PORT=5432 \
            -e POSTGRES_USER=be2osm \
            -e POSTGRES_PASSWORD=be2osm \
            "$PROCESSING_IMAGE" just urbis-full

      # The server restores it next to its live data and swaps it in (processing/scripts/publish-schema.sh)
      - name: Create UrbIS dump (schema urbis_next)
        run: |
          PGPASSWORD=be2osm psql -h localhost -U be2osm -d be2osm -v ON_ERROR_STOP=1 \
            -c "ALTER SCHEMA urbis RENAME TO urbis_next"
          PGPASSWORD=be2osm pg_dump -h localhost -U be2osm \
            --no-owner --no-acl \
            -n urbis_next \
            be2osm | gzip > urbis.sql.gz
          ls -lh urbis.sql.gz

      - name: Upload UrbIS dump
        uses: actions/upload-artifact@v7
        with:
          name: urbis-dump
          path: urbis.sql.gz
          retention-days: 7

  import:
    runs-on: ubuntu-latest
    needs: process
    name: Import UrbIS
    steps:
      - uses: actions/checkout@v7
      - name: Restore the dump on the server (waits for the job)
        if: ${{ vars.WEBHOOK_URL != '' }}
        timeout-minutes: 300
        env:
          WEBHOOK_URL: ${{ vars.WEBHOOK_URL }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
        run: |
          .github/scripts/webhook-job.sh urbis-restore '{"run_id": "${{ github.run_id }}"}'

name: PICC Update

on:
  workflow_dispatch:
  # Monthly schedule ('0 5 1 * *') paused: the update inserts by column order and its REFRESH CONCURRENTLY
  # fails without a unique index. Re-enabled once the update path is fixed and tested.

jobs:
  trigger-update:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger PICC update on server
        if: ${{ vars.WEBHOOK_URL != '' }}
        run: |
          curl -fsSL -X POST "${{ vars.WEBHOOK_URL }}/update-picc" \
            -H "X-Webhook-Secret: ${{ secrets.WEBHOOK_SECRET }}"
          echo "PICC update triggered on server"

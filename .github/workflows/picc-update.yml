name: PICC Update

on:
  workflow_dispatch:
  # Monthly schedule ('0 5 1 * *') paused: the update inserts by column order and its REFRESH CONCURRENTLY
  # fails without a unique index. Re-enabled once the update path is fixed and tested.

jobs:
  trigger-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Trigger PICC update on server
        if: ${{ vars.WEBHOOK_URL != '' }}
        timeout-minutes: 300
        env:
          WEBHOOK_URL: ${{ vars.WEBHOOK_URL }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
        run: .github/scripts/webhook-job.sh update-picc

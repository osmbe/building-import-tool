---
# Imposm3 mapping for Belgium OSM buildings
# This configuration imports building polygons with relevant tags

# Imposm3 only caches tags that are referenced in a table's `mapping`/`columns`, even for hstore_tags
# columns that are meant to capture "all tags" (see https://imposm.org/docs/imposm3/latest/mapping.html#tags).
# source:geometry:ref/:date/:entity are written by BE2OSM exports (app/utils/candidates.ts) but never
# used in any table mapping/columns here, so without this they are silently dropped before the
# hstore_tags column ever sees them, and the "Source" match mode in the difference API never matches
# anything (source:geometry:oidn doesn't need to be listed: it already has its own column below).
tags:
  include:
    - source:geometry:ref
    - source:geometry:date
    - source:geometry:entity

tables:
  buildings:
    type: polygon
    columns:
      # Core OSM identifiers
      - name: osm_id
        type: id
      - name: geometry
        type: geometry
      # Building type (extracted for convenience)
      - name: building_type
        type: string
        key: building
      # GRB-specific field
      - name: oidn
        type: string
        key: source:geometry:oidn
      # Store ALL tags as hstore (will convert to JSONB in transformation)
      - name: tags
        type: hstore_tags
    mapping:
      building:
        - __any__
    filters:
      reject:
        building: ["no"]

  building_parts:
    type: polygon
    columns:
      - name: osm_id
        type: id
      - name: geometry
        type: geometry
      - name: building_part
        type: string
        key: building:part
      - name: building
        type: string
      - name: building_levels
        type: integer
      - name: roof_levels
        type: integer
      - name: height
        type: string
      - name: roof_shape
        type: string
      - name: min_level
        type: integer
      - name: max_level
        type: integer
      - name: tags
        type: hstore_tags
    mapping:
      building:part:
        - __any__

  addresses:
    type: point
    columns:
      # Core OSM identifiers
      - name: osm_id
        type: id
      - name: geometry
        type: geometry
      # Address tags (extracted for convenience)
      - name: housenumber
        type: string
        key: addr:housenumber
      - name: street
        type: string
        key: addr:street
      - name: postcode
        type: string
        key: addr:postcode
      - name: city
        type: string
        key: addr:city
      # Store ALL tags as hstore
      - name: tags
        type: hstore_tags
    mapping:
      addr:housenumber:
        - __any__

generalized_tables:
  buildings_gen:
    source: buildings
    tolerance: 10.0
    sql_filter: ST_Area(geometry) > 50

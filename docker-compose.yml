services:
  # PostgreSQL with PostGIS
  postgres:
    image: postgis/postgis:18-3.6
    platform: linux/amd64
    container_name: be2osm-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-be2osm}
    volumes:
      # Use local storage for imports (NAS is too slow for bulk writes)
      # After import, data can be migrated to NAS if needed
      - postgres-data:/var/lib/postgresql
      - ./postgres/01-init-db.sql:/docker-entrypoint-initdb.d/01-init-db.sql:ro
      - ./postgres/02-setup-be2osm.sql:/docker-entrypoint-initdb.d/02-setup-be2osm.sql:ro
      - ./postgres/03-setup-osmbe.sql:/docker-entrypoint-initdb.d/03-setup-osmbe.sql:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-be2osm}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 1G
    ports:
      - "5432:5432"
    networks:
      - infra

  # Nuxt 3 Application
  nuxt-app:
    # Use NUXT_IMAGE if set (for production deployments), otherwise build locally
    image: ${NUXT_IMAGE:-}
    build:
      context: ./app
      args:
        OSM_CLIENT_ID: ${OSM_CLIENT_ID}
        OSM_CLIENT_SECRET: ${OSM_CLIENT_SECRET}
        OSM_REDIRECT_URI: ${OSM_REDIRECT_URI}
    container_name: be2osm-nuxt
    environment:
      OSM_CLIENT_ID: ${OSM_CLIENT_ID}
      OSM_CLIENT_SECRET: ${OSM_CLIENT_SECRET}
      OSM_REDIRECT_URI: ${OSM_REDIRECT_URI}
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      NODE_ENV: production
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    networks:
      - infra

  # Martin Tile Server - GRB Data
  grb-tiles:
    image: ghcr.io/maplibre/martin:1.1.0
    container_name: be2osm-grb-tiles
    volumes:
      - ./config/martin/grb-config.yaml:/config.yaml:ro,Z
    command: ["--config", "/config.yaml"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - infra

  # Martin Tile Server - OSM Data
  osm-tiles:
    image: ghcr.io/maplibre/martin:1.1.0
    container_name: be2osm-osm-tiles
    volumes:
      - ./config/martin/osm-config.yaml:/config.yaml:ro,Z
    command: ["--config", "/config.yaml"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - infra

  # Data Processing Tools (ogr2ogr, imposm3, Just)
  processing:
    build:
      context: ./processing
      dockerfile: Dockerfile
    image: be2osm-processing:latest
    container_name: be2osm-processing
    profiles:
      - processing
    volumes:
      - ./processing:/work
      - ./processing/data:/work/data
      - ./processing/logs:/work/logs
    env_file:
      - .env
    environment:
      # PGPASSWORD needed for psql commands
      - PGPASSWORD=${POSTGRES_PASSWORD}
      # Override POSTGRES_HOST to use the container name for internal Docker networking
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - infra
    stdin_open: true
    tty: true
    command: just

  # One-shot service for running specific processing tasks
  # Usage: docker compose run --rm task osm-download
  task:
    extends: processing
    container_name: be2osm-task
    profiles:
      - task
    entrypoint: ["just"]

  # Caddy reverse proxy
  caddy:
    image: caddy:2-alpine
    container_name: be2osm-caddy
    ports:
      - "3000:80"
    volumes:
      - ./caddy/Caddyfile.dev:/etc/caddy/Caddyfile:ro
    restart: unless-stopped
    networks:
      - infra

networks:
  infra:
    external: true

volumes:
  postgres-data:
  osm-downloads:
  osm-cache:
  grb-uploads:
  logs:

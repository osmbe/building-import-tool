services:
  # PostgreSQL with PostGIS
  postgres:
    image: postgis/postgis:18-3.6
    platform: linux/amd64
    container_name: be2osm-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-be2osm}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # The following scripts will be executed in alphabetical order during the first initialization of the database
      - ./postgres/01-init-db.sql:/docker-entrypoint-initdb.d/01-init-db.sql:ro,z
      - ./postgres/02-setup-be2osm.sql:/docker-entrypoint-initdb.d/02-setup-be2osm.sql:ro,z
      - ./postgres/03-setup-osmbe.sql:/docker-entrypoint-initdb.d/03-setup-osmbe.sql:ro,z
      - ./postgres/04-setup-fdw.sql:/docker-entrypoint-initdb.d/04-setup-fdw.sql:ro,z
      - ./postgres/05-setup-picc.sql:/docker-entrypoint-initdb.d/05-setup-picc.sql:ro,z
    # ports:
    #   - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-be2osm}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - be2osm

  # Nuxt 3 Application
  nuxt-app:
    image: ${NUXT_IMAGE:-}
    platform: linux/amd64
    build:
      context: ./app
      args:
        OSM_CLIENT_ID: ${OSM_CLIENT_ID}
        OSM_REDIRECT_URI: ${OSM_REDIRECT_URI}
    container_name: be2osm-nuxt
    environment:
      OSM_CLIENT_ID: ${OSM_CLIENT_ID}
      OSM_CLIENT_SECRET: ${OSM_CLIENT_SECRET}
      OSM_REDIRECT_URI: ${OSM_REDIRECT_URI}
      JWT_SECRET: ${JWT_SECRET}
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - be2osm

  # Martin Tile Server - GRB Data
  grb-tiles:
    image: ghcr.io/maplibre/martin:1.3.1
    container_name: be2osm-grb-tiles
    command: ["--config", "/config.yaml"]
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./config/martin/grb-config.yaml:/config.yaml:ro,Z
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:3000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - be2osm

  # Martin Tile Server - OSM Data
  osm-tiles:
    image: ghcr.io/maplibre/martin:1.3.1
    container_name: be2osm-osm-tiles
    command: ["--config", "/config.yaml"]
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./config/martin/osm-config.yaml:/config.yaml:ro,Z
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:3000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - be2osm

  # Data Processing Tools (ogr2ogr, imposm3, Just)
  # Usage:
  #   docker compose run --rm processing just <command>
  processing:
    image: ${PROCESSING_IMAGE:-}
    # Note: No platform specified - builds natively for host architecture
    # imposm3 is built from source on arm64
    build:
      context: ./processing
      dockerfile: Dockerfile
    container_name: be2osm-processing
    profiles:
      - processing
    env_file:
      - .env
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
    volumes:
      - ./processing:/work:z
      - ./processing/data:/work/data:z
      - ./processing/logs:/work/logs:z
      # Mount gh CLI config for remote import authentication
      # Note: Update this path to match your system's gh config location
      # Linux: /home/username/.config/gh
      # macOS: /Users/username/.config/gh
      - ${HOME}/.config/gh:/root/.config/gh:ro
    depends_on:
      postgres:
        condition: service_healthy
    stdin_open: true
    tty: true
    networks:
      - be2osm

  # Webhook service: receives POST /osm-restore from GitHub Actions and restores the OSM dump
  webhook:
    build:
      context: ./webhook
    container_name: be2osm-webhook
    environment:
      WEBHOOK_SECRET: ${WEBHOOK_SECRET}
      WEBHOOK_PORT: 9000
      GH_TOKEN: ${GH_TOKEN:-}
      GH_REPO: ${GH_REPO:-osmbe/building-import-tool}
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      # gh CLI config for artifact download authentication
      # Linux: /home/username/.config/gh  |  macOS: /Users/username/.config/gh
      - ${HOME}/.config/gh:/root/.config/gh:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - be2osm

  caddy:
    image: caddy:2-alpine
    container_name: be2osm-caddy
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro,z
      - caddy_data:/data
    depends_on:
      nuxt-app:
        condition: service_healthy
      grb-tiles:
        condition: service_healthy
      osm-tiles:
        condition: service_healthy
      webhook:
        condition: service_started
    restart: unless-stopped
    networks:
      - be2osm
      - nginx-proxy-network

networks:
  be2osm:
    driver: bridge
  nginx-proxy-network:
    external: true
volumes:
  postgres-data:
  caddy_data:

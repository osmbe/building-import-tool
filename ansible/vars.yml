---
# BE2OSM Processing Variables
# These can be overridden via command line: -e "var=value"

# Digital Ocean Configuration
do_droplet_name: be2osm-processing
do_droplet_size: s-8vcpu-16gb    # 8 vCPU, 16GB RAM
do_droplet_region: ams3           # Amsterdam 3
do_droplet_image: debian-12-x64

# Paths on the processing VM
repo_dest: /opt/be2osm

# Database
postgres_user: be2osm
postgres_db: be2osm

# Backup settings
backup_dir: /opt/be2osm/data/backups

# API Keys (loaded from environment variables)
do_api_token: "{{ lookup('env', 'DO_API_TOKEN') }}"
digital_vlaanderen_api_key: "{{ lookup('env', 'DIGITAL_VLAANDEREN_API_KEY') }}"

# SSH key name in Digital Ocean (must match your registered key)
do_ssh_key_name: "{{ lookup('env', 'DO_SSH_KEY_NAME') | default('default', true) }}"

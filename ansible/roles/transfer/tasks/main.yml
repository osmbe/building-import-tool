---
# Transfer Role - Creates database dumps and transfers to control node (lightweight VPS)

- name: Validate target_path is provided
  ansible.builtin.fail:
    msg: |
      target_path variable is required!
      Usage: ansible-playbook playbook.yml -e "target_path=/opt/be2osm/data/backups"
  when: target_path is not defined or target_path | length == 0

- name: Display transfer target
  ansible.builtin.debug:
    msg: "Will transfer dumps to control node at {{ target_path }}"

# ============================================
# Create Database Dumps
# ============================================

- name: Get current date for backup filename
  ansible.builtin.set_fact:
    backup_date: "{{ lookup('pipe', 'date +%Y-%m-%d') }}"

- name: Create backup directory on processing VM
  ansible.builtin.file:
    path: "{{ backup_dir }}"
    state: directory
    mode: '0755'

- name: Create OSM database dump
  ansible.builtin.shell: |
    docker compose exec -T postgres pg_dump -U {{ postgres_user }} -d osmbe | gzip > {{ backup_dir }}/osmbe-{{ backup_date }}.sql.gz
  args:
    chdir: "{{ repo_dest }}"
  register: osm_dump

- name: Create GRB database dump
  ansible.builtin.shell: |
    docker compose exec -T postgres pg_dump -U {{ postgres_user }} -d {{ postgres_db }} | gzip > {{ backup_dir }}/be2osm-{{ backup_date }}.sql.gz
  args:
    chdir: "{{ repo_dest }}"
  register: grb_dump

- name: List created dump files
  ansible.builtin.find:
    paths: "{{ backup_dir }}"
    patterns: "*.sql.gz"
  register: dump_files

- name: Display dump file sizes
  ansible.builtin.debug:
    msg: |
      Created dumps:
      {% for file in dump_files.files %}
      - {{ file.path | basename }}: {{ (file.size / 1024 / 1024) | round(2) }} MB
      {% endfor %}

# ============================================
# Transfer to Control Node (Lightweight VPS)
# ============================================

- name: Ensure target directory exists on control node
  ansible.builtin.file:
    path: "{{ target_path }}"
    state: directory
    mode: '0755'
  delegate_to: localhost
  become: false

- name: Fetch dump files to control node
  ansible.builtin.fetch:
    src: "{{ item.path }}"
    dest: "{{ target_path }}/"
    flat: true
  loop: "{{ dump_files.files }}"

- name: Display transfer status
  ansible.builtin.debug:
    msg: |
      Successfully transferred {{ dump_files.files | length }} dump files to {{ target_path }}

      Files transferred:
      {% for file in dump_files.files %}
      - {{ file.path | basename }}
      {% endfor %}

      To restore on this server:
        gunzip -c {{ target_path }}/osmbe-{{ backup_date }}.sql.gz | psql -d osmbe
        gunzip -c {{ target_path }}/be2osm-{{ backup_date }}.sql.gz | psql -d be2osm

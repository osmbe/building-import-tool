---
# Processing Role - Runs OSM and GRB data imports

- name: Build processing Docker image
  ansible.builtin.command:
    cmd: docker compose build processing
    chdir: "{{ repo_dest }}"
  register: build_result
  changed_when: "'Successfully built' in build_result.stdout or 'writing image' in build_result.stdout"

- name: Display build status
  ansible.builtin.debug:
    msg: "Processing image built successfully"

# ============================================
# OSM Data Import
# ============================================

- name: Download OSM data from Geofabrik
  ansible.builtin.command:
    cmd: docker compose run --rm processing just osm-download
    chdir: "{{ repo_dest }}"
  register: osm_download
  changed_when: "'Downloaded' in osm_download.stdout"
  # This can take 5-10 minutes depending on connection speed

- name: Display OSM download status
  ansible.builtin.debug:
    msg: "OSM data downloaded: {{ osm_download.stdout_lines[-3:] | join('\n') }}"
  when: osm_download.stdout_lines | length > 0

- name: Import OSM data to PostgreSQL
  ansible.builtin.command:
    cmd: docker compose run --rm processing just osm-import
    chdir: "{{ repo_dest }}"
  register: osm_import
  # This can take 20-30 minutes for Belgium
  async: 3600  # 1 hour timeout
  poll: 30     # Check every 30 seconds

- name: Display OSM import status
  ansible.builtin.debug:
    msg: "OSM import completed"

# ============================================
# GRB Data Import
# ============================================

- name: Check if DIGITAL_VLAANDEREN_API_KEY is set
  ansible.builtin.fail:
    msg: "DIGITAL_VLAANDEREN_API_KEY is not set. Get a key from Digital Vlaanderen."
  when: digital_vlaanderen_api_key | length == 0

- name: Run GRB full import (order, download, import)
  ansible.builtin.command:
    cmd: docker compose run --rm processing just grb-full
    chdir: "{{ repo_dest }}"
  register: grb_import
  # GRB import can take 30-60 minutes (includes API wait times)
  async: 7200  # 2 hour timeout
  poll: 60     # Check every minute

- name: Display GRB import status
  ansible.builtin.debug:
    msg: "GRB import completed"

# ============================================
# Verify Data
# ============================================

- name: Check OSM building count
  ansible.builtin.command:
    cmd: docker compose exec -T postgres psql -U {{ postgres_user }} -d osmbe -t -c "SELECT COUNT(*) FROM osm.osm_buildings;"
    chdir: "{{ repo_dest }}"
  register: osm_count
  changed_when: false

- name: Check GRB building count
  ansible.builtin.command:
    cmd: docker compose exec -T postgres psql -U {{ postgres_user }} -d {{ postgres_db }} -t -c "SELECT COUNT(*) FROM grb.buildings;"
    chdir: "{{ repo_dest }}"
  register: grb_count
  changed_when: false

- name: Display import statistics
  ansible.builtin.debug:
    msg: |
      Import Statistics:
      - OSM Buildings: {{ osm_count.stdout | trim }}
      - GRB Buildings: {{ grb_count.stdout | trim }}

---
# Common role - System setup and hardening

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Upgrade all packages
  ansible.builtin.apt:
    upgrade: safe

- name: Install essential packages
  ansible.builtin.apt:
    name:
      - curl
      - wget
      - git
      - vim
      - htop
      - unzip
      - ca-certificates
      - gnupg
      - lsb-release
      - python3-pip
      - ufw
      - fail2ban
    state: present

- name: Set timezone
  community.general.timezone:
    name: "{{ timezone | default('Europe/Brussels') }}"

- name: Create deploy group
  ansible.builtin.group:
    name: "{{ deploy_group }}"
    state: present
  when: deploy_user is defined

- name: Create deploy user
  ansible.builtin.user:
    name: "{{ deploy_user }}"
    group: "{{ deploy_group }}"
    groups: sudo
    shell: /bin/bash
    create_home: true
    state: present
  when: deploy_user is defined

- name: Add deploy user to docker group
  ansible.builtin.user:
    name: "{{ deploy_user }}"
    groups: docker
    append: true
  when: deploy_user is defined
  notify: Restart docker

- name: Configure UFW - Reset
  community.general.ufw:
    state: reset

- name: Configure UFW - Default deny incoming
  community.general.ufw:
    direction: incoming
    policy: deny

- name: Configure UFW - Default allow outgoing
  community.general.ufw:
    direction: outgoing
    policy: allow

- name: Configure UFW - Allow SSH
  community.general.ufw:
    rule: allow
    port: "{{ ssh_port | default('22') }}"
    proto: tcp

- name: Configure UFW - Allow HTTP
  community.general.ufw:
    rule: allow
    port: "80"
    proto: tcp

- name: Configure UFW - Allow HTTPS
  community.general.ufw:
    rule: allow
    port: "443"
    proto: tcp

- name: Enable UFW
  community.general.ufw:
    state: enabled

- name: Configure fail2ban
  ansible.builtin.copy:
    dest: /etc/fail2ban/jail.local
    content: |
      [DEFAULT]
      bantime = 1h
      findtime = 10m
      maxretry = 5

      [sshd]
      enabled = true
      port = {{ ssh_port | default('22') }}
      filter = sshd
      logpath = /var/log/auth.log
      maxretry = 3
    mode: "0644"
  notify: Restart fail2ban

- name: Enable and start fail2ban
  ansible.builtin.systemd:
    name: fail2ban
    enabled: true
    state: started

---
# Droplet Role - Creates and manages Digital Ocean VM

- name: Validate DO_API_TOKEN is set
  ansible.builtin.fail:
    msg: "DO_API_TOKEN environment variable is not set. Get a token from https://cloud.digitalocean.com/account/api/tokens"
  when: do_api_token | length == 0

- name: Get SSH key info from Digital Ocean
  community.digitalocean.digital_ocean_sshkey_info:
    oauth_token: "{{ do_api_token }}"
  register: do_ssh_keys

- name: Fail if no SSH keys found
  ansible.builtin.fail:
    msg: "No SSH keys found in Digital Ocean. Register your key at https://cloud.digitalocean.com/account/security"
  when: do_ssh_keys.data | length == 0

- name: Set SSH key ID (use first available key)
  ansible.builtin.set_fact:
    do_ssh_key_id: "{{ do_ssh_keys.data[0].id }}"

- name: Display SSH key being used
  ansible.builtin.debug:
    msg: "Using SSH key: {{ do_ssh_keys.data[0].name }} ({{ do_ssh_key_id }})"

- name: Create Digital Ocean droplet
  community.digitalocean.digital_ocean_droplet:
    state: present
    name: "{{ do_droplet_name }}"
    size: "{{ do_droplet_size }}"
    region: "{{ do_droplet_region }}"
    image: "{{ do_droplet_image }}"
    ssh_keys:
      - "{{ do_ssh_key_id }}"
    oauth_token: "{{ do_api_token }}"
    unique_name: true
    wait: true
    wait_timeout: 300
  register: droplet_result

- name: Display droplet info
  ansible.builtin.debug:
    msg: |
      Droplet created successfully!
      Name: {{ droplet_result.data.droplet.name }}
      IP: {{ droplet_result.data.droplet.networks.v4[0].ip_address }}
      Size: {{ droplet_result.data.droplet.size_slug }}
      Region: {{ droplet_result.data.droplet.region.slug }}

- name: Set droplet IP as fact
  ansible.builtin.set_fact:
    droplet_ip: "{{ droplet_result.data.droplet.networks.v4[0].ip_address }}"

- name: Add droplet to inventory
  ansible.builtin.add_host:
    name: processing_vm
    groups: processing
    ansible_host: "{{ droplet_ip }}"
    ansible_user: root
    ansible_ssh_common_args: '-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'

- name: Wait for SSH to become available
  ansible.builtin.wait_for:
    host: "{{ droplet_ip }}"
    port: 22
    delay: 10
    timeout: 300
    state: started
  delegate_to: localhost

- name: Wait for cloud-init to complete (droplet to be fully ready)
  ansible.builtin.pause:
    seconds: 30
    prompt: "Waiting for droplet to initialize..."

# Martin configuration for OSM Belgium data
# This file configures the Martin tile server to serve OSM buildings as vector tiles

# Listen configuration
listen_addresses: "0.0.0.0:3000"

# CORS settings for web access
cors: true

# Performance settings. Use this `cache:` section, never the legacy top-level cache size key: Martin >= 1.12 skips
# environment variable substitution in the whole file when that key name appears anywhere in it, even in a comment.
# Entries expire so tiles pick up re-imported data.
cache:
  size_mb: 512
  expiry: 1h

# PostgreSQL connection for OSM Belgium data
postgres:
  # Unquoted on purpose: since Martin 1.12 environment variables are only substituted in plain (unquoted) YAML
  # scalars. Never write a dollar sign in comments here: older Martin versions also substitute inside comments.
  # tests/db/cases/60-martin.sh starts every config against a test database to catch such regressions.
  connection_string: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/osmbe
  pool_size: 20
  max_feature_count: 10000
  default_srid: 3857

  # Explicit table configuration to control ID column
  tables:
    osm_buildings:
      schema: osm
      table: osm_buildings
      srid: 3857
      geometry_column: geom_mercator
      id_column: osm_id
      clip_geom: true
      buffer: 64
      extent: 4096
      minzoom: 10
      maxzoom: 22
      # Send complete JSONB tags + minimal metadata
      # Frontend will flatten tags as top-level properties
      properties:
        osm_id: osm_id
        tags: tags # Complete JSONB with all OSM tags

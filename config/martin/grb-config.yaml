# Martin configuration for GRB Building Tiles
# This file configures the Martin tile server to serve GRB building data as vector tiles

# Listen configuration
listen_addresses: "0.0.0.0:3000"

# CORS settings for web access
cors: true

# Performance settings
cache_size_mb: 512

# PostgreSQL connection for GRB data
postgres:
  connection_string: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/be2osm"
  pool_size: 20
  max_feature_count: 10000
  default_srid: 3857

  # Table configuration - Building polygons with addresses (materialized view)
  tables:
    buildings:
      schema: grb
      table: buildings_with_addresses
      srid: 3857
      geometry_column: geom
      id_column: oidn
      clip_geom: true
      buffer: 64
      extent: 4096
      minzoom: 10
      maxzoom: 22
      properties:
        oidn: oidn
        gebouw_id: gebouw_id
        polygon_area_m2: polygon_area_m2
        polygon_type_label: polygon_type_label
        survey_date: survey_date
        origin_label: origin_label
        polygon_count: polygon_count
        total_area_m2: total_area_m2
        building_type_label: building_type_label
        addresses: addresses
        street_names: street_names
        postcodes: postcodes
        municipalities: municipalities
        address_count: address_count

    kunstwerken:
      schema: grb
      table: kunstwerken
      srid: 3857
      geometry_column: geom_mercator
      id_column: oidn
      clip_geom: true
      buffer: 64
      extent: 4096
      minzoom: 10
      maxzoom: 22
      properties:
        oidn: oidn
        uidn: uidn
        entity: entity
        type_code: type_code
        type_label: type_label
        survey_date: survey_date
        origin_label: origin_label
        area_m2: area_m2
        length_m: length_m

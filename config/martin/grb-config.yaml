# Martin configuration for GRB Building Tiles
# This file configures the Martin tile server to serve GRB building data as vector tiles

# Listen configuration
listen_addresses: "0.0.0.0:3000"

# CORS settings for web access
cors: true

# Performance settings. Use this `cache:` section, never the legacy top-level cache size key: Martin >= 1.12 skips
# environment variable substitution in the whole file when that key name appears anywhere in it, even in a comment.
# Entries expire so tiles pick up re-imported data.
cache:
  size_mb: 512
  expiry: 1h

# PostgreSQL connection for GRB data
postgres:
  # Unquoted on purpose: since Martin 1.12 environment variables are only substituted in plain (unquoted) YAML
  # scalars. Never write a dollar sign in comments here: older Martin versions also substitute inside comments.
  # tests/db/cases/60-martin.sh starts every config against a test database to catch such regressions.
  connection_string: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/be2osm
  pool_size: 20
  max_feature_count: 10000
  default_srid: 3857

  # Table configuration - Building polygons with addresses (materialized view)
  tables:
    buildings:
      schema: grb
      table: buildings_with_addresses
      srid: 3857
      geometry_column: geom
      # OIDNs are only unique per entity (a GBG and a GBA polygon can share one), so the feature id is
      # the unique polygon row id. Fragments of a polygon split across tiles are merged by this id.
      id_column: polygon_id
      clip_geom: true
      buffer: 64
      extent: 4096
      minzoom: 10
      maxzoom: 22
      properties:
        polygon_id: polygon_id
        entity: entity
        oidn: oidn
        gebouw_id: gebouw_id
        polygon_area_m2: polygon_area_m2
        polygon_type_label: polygon_type_label
        survey_date: survey_date
        origin_label: origin_label
        polygon_count: polygon_count
        total_area_m2: total_area_m2
        building_type_label: building_type_label
        addresses: addresses
        street_names: street_names
        postcodes: postcodes
        municipalities: municipalities
        address_count: address_count

    kunstwerken:
      schema: grb
      table: kunstwerken
      srid: 3857
      geometry_column: geom_mercator
      id_column: oidn
      clip_geom: true
      buffer: 64
      extent: 4096
      minzoom: 10
      maxzoom: 22
      properties:
        oidn: oidn
        uidn: uidn
        entity: entity
        type_code: type_code
        type_label: type_label
        survey_date: survey_date
        origin_label: origin_label
        area_m2: area_m2
        length_m: length_m

    # The candidates contract (processing/sql/migrations/grb/004_candidates.sql): the same properties for
    # every source. The app reads these; the sources above stay for the previous release until they are removed.
    candidates:
      schema: grb
      table: candidates
      srid: 3857
      geometry_column: geom
      id_column: fid
      clip_geom: true
      buffer: 64
      extent: 4096
      minzoom: 10
      maxzoom: 22
      properties:
        fid: fid
        source: source
        entity: entity
        source_id: source_id
        source_ref: source_ref
        type_code: type_code
        type_label: type_label
        survey_date: survey_date
        origin_label: origin_label
        area_m2: area_m2
        parent_id: parent_id
        parent_type_label: parent_type_label
        parent_part_count: parent_part_count
        parent_area_m2: parent_area_m2
        addresses: addresses
        street_names: street_names
        postcodes: postcodes
        municipalities: municipalities
        address_count: address_count

    knw_candidates:
      schema: grb
      table: knw_candidates
      srid: 3857
      geometry_column: geom
      id_column: fid
      clip_geom: true
      buffer: 64
      extent: 4096
      minzoom: 10
      maxzoom: 22
      properties:
        fid: fid
        source: source
        entity: entity
        source_id: source_id
        source_ref: source_ref
        type_code: type_code
        type_label: type_label
        survey_date: survey_date
        origin_label: origin_label
        area_m2: area_m2
        parent_id: parent_id
        parent_type_label: parent_type_label
        parent_part_count: parent_part_count
        parent_area_m2: parent_area_m2
        addresses: addresses
        street_names: street_names
        postcodes: postcodes
        municipalities: municipalities
        address_count: address_count

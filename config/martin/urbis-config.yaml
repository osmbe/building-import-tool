# Martin configuration for Urbis Building Tiles (Brussels-Capital Region)
# This file configures the Martin tile server to serve Urbis building data as vector tiles

# Listen configuration
listen_addresses: "0.0.0.0:3000"

# CORS settings for web access
cors: true

# Performance settings. Use this `cache:` section, never the legacy top-level cache size key: Martin >= 1.12 skips
# environment variable substitution in the whole file when that key name appears anywhere in it, even in a comment.
# Entries expire so tiles pick up re-imported data.
cache:
  size_mb: 512
  expiry: 1h

# PostgreSQL connection for Urbis data
postgres:
  # Unquoted on purpose: since Martin 1.12 environment variables are only substituted in plain (unquoted) YAML
  # scalars. Never write a dollar sign in comments here: older Martin versions also substitute inside comments.
  # tests/db/cases/60-martin.sh starts every config against a test database to catch such regressions.
  connection_string: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/be2osm
  pool_size: 20
  max_feature_count: 10000
  default_srid: 3857

  # Table configuration - Building polygons with addresses (materialized view)
  tables:
    buildings:
      schema: urbis
      table: buildings_with_addresses
      srid: 3857
      geometry_column: geom
      id_column: building_id
      clip_geom: true
      buffer: 64
      extent: 4096
      minzoom: 10
      maxzoom: 22
      properties:
        building_id: building_id
        inspire_id: inspire_id
        block_id: block_id
        area_m2: area_m2
        addresses: addresses
        street_names: street_names
        postcodes: postcodes
        municipalities: municipalities
        address_count: address_count

    # The candidates contract (processing/sql/migrations/grb/004_candidates.sql): the same properties for
    # every source. The app reads these; the sources above stay for the previous release until they are removed.
    candidates:
      schema: urbis
      table: candidates
      srid: 3857
      geometry_column: geom
      id_column: fid
      clip_geom: true
      buffer: 64
      extent: 4096
      minzoom: 10
      maxzoom: 22
      properties:
        fid: fid
        source: source
        entity: entity
        source_id: source_id
        source_ref: source_ref
        type_code: type_code
        type_label: type_label
        survey_date: survey_date
        origin_label: origin_label
        area_m2: area_m2
        parent_id: parent_id
        parent_type_label: parent_type_label
        parent_part_count: parent_part_count
        parent_area_m2: parent_area_m2
        addresses: addresses
        street_names: street_names
        postcodes: postcodes
        municipalities: municipalities
        address_count: address_count
